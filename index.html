<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --rose: #e8a0a0;
  --rose-light: #f5e0e0;
  --rose-deep: #c97070;
  --cream: #fdf8f4;
  --warm: #f0e8df;
  --text: #3a2e2e;
  --text-muted: #8a7070;
  --green: #7dab8a;
  --green-light: #e0f0e5;
  --amber: #d4956a;
  --amber-light: #f5e8da;
  --border: rgba(200,160,160,0.25);
  --purple: #9b8ec4;
  --purple-light: #ede8f5;
}
html, body { background: var(--cream); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }
.app { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

/* HEADER */
.header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--border); position: relative; }
.header-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 400; }
.header-title em { font-style: italic; color: var(--rose-deep); }
.header-date { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 300; }
.sync-status { position: absolute; top: 0; right: 0; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--rose-deep); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* STREAK */
.streak-bar { display: flex; gap: 10px; margin-bottom: 1.5rem; }
.streak-card { flex: 1; background: white; border: 0.5px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; text-align: center; }
.streak-num { font-size: 22px; font-weight: 500; color: var(--rose-deep); font-family: 'Playfair Display', serif; }
.streak-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-weight: 300; }

/* SECTION */
.section { margin-bottom: 1.5rem; }
.section-title { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 0.75rem; padding-left: 2px; }

/* TASK CARD */
.task-card { background: white; border: 0.5px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.6rem; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: border-color 0.2s; position: relative; overflow: hidden; }
.task-card:active { transform: scale(0.98); }
.task-card.done { background: var(--rose-light); border-color: var(--rose); }
.task-card.done::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--rose-deep); border-radius: 14px 14px 0 0; }
.task-card.locked { opacity: 0.4; cursor: not-allowed; }
.task-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rose); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all 0.2s; background: white; }
.task-card.done .task-check { background: var(--rose-deep); border-color: var(--rose-deep); }
.task-check i { font-size: 13px; color: white; display: none; }
.task-card.done .task-check i { display: block; }
.task-info { flex: 1; }
.task-name { font-size: 14px; font-weight: 500; }
.task-card.done .task-name { color: var(--text-muted); text-decoration: line-through; }
.task-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 300; }
.task-time { font-size: 11px; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; font-weight: 500; }
.time-now { background: #e8f5e0; color: #3d7a54; }
.time-past { background: var(--warm); color: var(--text-muted); }
.time-future { background: #eee; color: #aaa; }
.time-locked { background: #eee; color: #ccc; }

/* SKINCARE */
.skincare-section { background: white; border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 0.6rem; }
.skincare-header { padding: 1rem 1.1rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.skincare-header-left { display: flex; align-items: center; gap: 10px; }
.skincare-header h3 { font-size: 14px; font-weight: 500; }
.collapse-content { display: none; }
.collapse-content.open { display: block; }
.skincare-steps { padding: 0.75rem 1.1rem 0.5rem; }
.step-row { display: flex; align-items: center; gap: 10px; padding: 0.5rem 0; border-bottom: 0.5px solid var(--border); }
.step-row:last-child { border-bottom: none; }
.step-num { width: 20px; height: 20px; border-radius: 50%; background: var(--warm); font-size: 11px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-name { font-size: 13px; flex: 1; }
.step-note { font-size: 11px; color: var(--text-muted); display: block; margin-top: 1px; }
.weekly-badge { font-size: 10px; background: var(--amber-light); color: var(--amber); padding: 2px 7px; border-radius: 20px; font-weight: 500; flex-shrink: 0; }
.conflict-badge { font-size: 10px; background: var(--purple-light); color: var(--purple); padding: 2px 7px; border-radius: 20px; font-weight: 500; flex-shrink: 0; }
.step-row.skip-today { opacity: 0.4; }
.step-row.skip-today .step-name::after { content: ' · 今日跳过'; color: var(--rose-deep); font-size: 11px; }

/* WATER */
.water-card { background: white; border: 0.5px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; }
.water-drops { display: flex; gap: 6px; flex-wrap: wrap; }
.drop { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 1.5px solid var(--rose); cursor: pointer; transition: all 0.2s; background: white; }
.drop.filled { background: var(--rose); border-color: var(--rose-deep); }
.drop:active { transform: rotate(-45deg) scale(0.9); }

/* PERIOD */
.period-card { background: white; border: 0.5px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; }
.period-pill { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.period-pill.active { background: #fde8e8; color: #c96060; }
.period-pill.normal { background: var(--green-light); color: #3d7a54; }
.period-pill.soon { background: var(--amber-light); color: var(--amber); }
.period-btns { display: flex; gap: 8px; margin-top: 12px; }
.period-btn { flex: 1; border: 0.5px solid var(--border); border-radius: 10px; padding: 0.55rem; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; background: white; color: var(--text); text-align: center; }
.period-btn.primary { background: var(--rose-light); color: var(--rose-deep); border-color: var(--rose); font-weight: 500; }

/* HISTORY */
.history-section { background: white; border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; }
.history-header { padding: 1rem 1.1rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.history-list { max-height: 320px; overflow-y: auto; }
.history-item { padding: 0.75rem 1.1rem; border-bottom: 0.5px solid var(--border); }
.history-item:last-child { border-bottom: none; }
.history-date { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.history-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.history-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
.h-done { background: var(--green-light); color: #3d7a54; }
.h-skip { background: var(--rose-light); color: var(--rose-deep); }
.h-note { background: var(--warm); color: var(--text-muted); }

/* SCHEDULE TABLE */
.schedule-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 0.5rem; }
.schedule-table td { padding: 5px 8px; }
.schedule-table tr:nth-child(even) td { background: var(--cream); }
.schedule-table td:first-child { color: var(--rose-deep); font-weight: 500; width: 80px; }

/* TOAST / PRAISE */
.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: white; border: 0.5px solid var(--border); border-radius: 16px; padding: 1rem 1.25rem; max-width: 320px; width: calc(100% - 2rem); box-shadow: 0 8px 32px rgba(58,46,46,0.12); z-index: 300; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast-emoji { font-size: 28px; margin-bottom: 6px; }
.toast-msg { font-size: 14px; line-height: 1.6; color: var(--text); }
.toast-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* MODALS */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,46,46,0.45); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
.modal-overlay.show { display: flex; }
.sheet { background: var(--cream); border-radius: 24px 24px 0 0; padding: 2rem 1.5rem 2.5rem; width: 100%; max-width: 680px; animation: slideUp 0.25s ease; }
.sheet-pill { width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 1.5rem; }
@keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }

/* CONFIRM SHEET */
.confirm-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--rose-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
.confirm-icon i { font-size: 26px; color: var(--rose-deep); }
.sheet h3 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 400; text-align: center; margin-bottom: 0.6rem; }
.sheet p { font-size: 13px; color: var(--text-muted); line-height: 1.7; text-align: center; margin-bottom: 1.5rem; }
.sheet-btns { display: flex; flex-direction: column; gap: 10px; }
.btn-primary { background: var(--rose-deep); color: white; border: none; border-radius: 14px; padding: 0.85rem; font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; font-weight: 500; }
.btn-secondary { background: white; color: var(--text-muted); border: 0.5px solid var(--border); border-radius: 14px; padding: 0.85rem; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; }

/* LATE SHEET */
.late-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
.late-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--amber-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.late-icon i { font-size: 20px; color: var(--amber); }
.field-label { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }
.field-group { margin-bottom: 0.9rem; }
.late-input, .late-textarea { width: 100%; border: 0.5px solid var(--border); border-radius: 12px; padding: 0.7rem 1rem; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); background: white; outline: none; transition: border-color 0.2s; }
.late-input:focus, .late-textarea:focus { border-color: var(--rose); }
.late-input.error, .late-textarea.error { border-color: var(--rose-deep); }
.late-textarea { resize: none; height: 76px; }
.err-msg { font-size: 11px; color: var(--rose-deep); margin-top: 3px; display: none; }
.err-msg.show { display: block; }

.footer-note { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 2rem; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">已同步</span></div>
    <div class="header-title">Susie 的 <em>每日档案</em></div>
    <div class="header-date" id="today-date"></div>
  </div>

  <div class="streak-bar">
    <div class="streak-card"><div class="streak-num" id="streak-days">—</div><div class="streak-label">连续打卡</div></div>
    <div class="streak-card"><div class="streak-num" id="total-days">—</div><div class="streak-label">累计天数</div></div>
    <div class="streak-card"><div class="streak-num" id="complete-rate">—</div><div class="streak-label">本周完成</div></div>
  </div>

  <div class="section">
    <div class="section-title">今日饮食</div>
    <div class="task-card" id="task-breakfast" onclick="handleMeal('breakfast')">
      <div class="task-check"><i class="ti ti-check"></i></div>
      <div class="task-info"><div class="task-name">早餐</div><div class="task-sub">不管几点起，起来第一件事吃东西</div></div>
      <div class="task-time" id="badge-breakfast"></div>
    </div>
    <div class="task-card" id="task-lunch" onclick="handleMeal('lunch')">
      <div class="task-check"><i class="ti ti-check"></i></div>
      <div class="task-info"><div class="task-name">午餐</div><div class="task-sub">12:00 左右，别拖太晚</div></div>
      <div class="task-time" id="badge-lunch"></div>
    </div>
    <div class="task-card" id="task-dinner" onclick="handleMeal('dinner')">
      <div class="task-check"><i class="ti ti-check"></i></div>
      <div class="task-info"><div class="task-name">晚餐</div><div class="task-sub">18:00—19:00，好好吃饭</div></div>
      <div class="task-time" id="badge-dinner"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">护肤打卡</div>
    <div class="skincare-section">
      <div class="skincare-header" onclick="toggleSection('skincare-morning')">
        <div class="skincare-header-left">
          <div class="task-check" id="morning-check" style="cursor:default;"><i class="ti ti-check"></i></div>
          <h3>早间护肤</h3>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="task-time" id="badge-morning-sc"></div>
          <i class="ti ti-chevron-down" id="icon-skincare-morning" style="transition:transform 0.2s;color:var(--text-muted);"></i>
        </div>
      </div>
      <div class="collapse-content" id="skincare-morning">
        <div class="skincare-steps" id="steps-morning"></div>
        <div style="padding:0 1.1rem 1rem;display:flex;gap:8px;">
          <button onclick="confirmSkincare('morning')" style="flex:1;background:var(--rose-deep);color:white;border:none;border-radius:10px;padding:0.6rem;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;">涂好了！</button>
          <button onclick="skipSkincare('morning')" style="flex:1;background:var(--warm);color:var(--text);border:none;border-radius:10px;padding:0.6rem;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;">今天跳过</button>
        </div>
      </div>
    </div>
    <div class="skincare-section">
      <div class="skincare-header" onclick="toggleSection('skincare-night')">
        <div class="skincare-header-left">
          <div class="task-check" id="night-check" style="cursor:default;"><i class="ti ti-check"></i></div>
          <h3>晚间护肤</h3>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="task-time" id="badge-night-sc"></div>
          <i class="ti ti-chevron-down" id="icon-skincare-night" style="transition:transform 0.2s;color:var(--text-muted);"></i>
        </div>
      </div>
      <div class="collapse-content" id="skincare-night">
        <div class="skincare-steps" id="steps-night"></div>
        <div style="padding:0 1.1rem 1rem;display:flex;gap:8px;">
          <button onclick="confirmSkincare('night')" style="flex:1;background:var(--rose-deep);color:white;border:none;border-radius:10px;padding:0.6rem;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;">涂好了！</button>
          <button onclick="skipSkincare('night')" style="flex:1;background:var(--warm);color:var(--text);border:none;border-radius:10px;padding:0.6rem;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;">今天跳过</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">喝水</div>
    <div class="water-card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">今天喝了几杯水？每杯约 250ml</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="water-drops" id="water-drops"></div>
        <div style="font-size:13px;color:var(--text-muted);flex-shrink:0;"><span id="water-num">0</span>/8 杯</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">经期追踪</div>
    <div class="period-card" id="period-card"></div>
  </div>

  <div class="section">
    <div class="section-title">提醒时间表</div>
    <div style="background:white;border:0.5px solid var(--border);border-radius:14px;padding:1rem 1.1rem;">
      <table class="schedule-table">
        <tr><td>起床后</td><td>吃早餐提醒</td></tr>
        <tr><td>11:30</td><td>午餐提醒</td></tr>
        <tr><td>12:30</td><td>早间护肤提醒</td></tr>
        <tr><td>17:30</td><td>晚餐提醒</td></tr>
        <tr><td>21:30</td><td>晚间护肤提醒</td></tr>
        <tr><td>随时</td><td>喝水！</td></tr>
      </table>
      <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">把这些时间加到 iPhone「提醒事项」，提醒响了来打开这个页面</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">历史记录</div>
    <div class="history-section">
      <div class="history-header" onclick="toggleSection('history-list')">
        <h3 style="font-size:14px;font-weight:500;">打卡记录</h3>
        <i class="ti ti-chevron-down" id="icon-history-list" style="transition:transform 0.2s;color:var(--text-muted);"></i>
      </div>
      <div class="collapse-content" id="history-list">
        <div class="history-list" id="history-items">
          <div style="padding:1.5rem;text-align:center;font-size:13px;color:var(--text-muted);">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-note">Leith · Susie 专属档案 · 每天都要好好的 🌸</div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="modal-confirm">
  <div class="sheet">
    <div class="sheet-pill"></div>
    <div class="confirm-icon"><i class="ti ti-sparkles"></i></div>
    <h3 id="confirm-title"></h3>
    <p id="confirm-msg"></p>
    <div class="sheet-btns">
      <button class="btn-primary" onclick="doConfirmSkincare()">涂了！认真涂了！</button>
      <button class="btn-secondary" onclick="closeModal('modal-confirm')">哎……确实没涂</button>
    </div>
  </div>
</div>

<!-- LATE MODAL -->
<div class="modal-overlay" id="modal-late">
  <div class="sheet">
    <div class="sheet-pill"></div>
    <div class="late-header">
      <div class="late-icon"><i class="ti ti-clock-exclamation"></i></div>
      <div><h3 id="late-title" style="text-align:left;font-size:17px;margin-bottom:2px;"></h3><div style="font-size:12px;color:var(--text-muted);" id="late-sub"></div></div>
    </div>
    <div id="late-fields"></div>
    <button class="btn-primary" onclick="submitLate()" style="margin-top:0.5rem;">提交记录</button>
  </div>
</div>

<!-- PERIOD MODAL -->
<div class="modal-overlay" id="modal-period">
  <div class="sheet">
    <div class="sheet-pill"></div>
    <h3 id="period-modal-title"></h3>
    <p id="period-modal-msg"></p>
    <div class="sheet-btns">
      <button class="btn-primary" onclick="confirmPeriodAction()">确认</button>
      <button class="btn-secondary" onclick="closeModal('modal-period')">取消</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-emoji" id="toast-emoji"></div>
  <div class="toast-msg" id="toast-msg"></div>
  <div class="toast-sub" id="toast-sub"></div>
</div>

<script>

async function supa(method, table, body, query='') {
  setSyncing(true);
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}${query}`, {
      method,
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': `Bearer ${SUPA_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': method==='POST' ? 'return=representation' : 'return=minimal'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = res.ok ? (res.status===204 ? null : await res.json()) : null;
    setSyncing(false, true);
    return data;
  } catch(e) {
    setSyncing(false, false);
    return null;
  }
}

function setSyncing(syncing, success) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (syncing) { dot.className='sync-dot syncing'; label.textContent='同步中…'; }
  else if (success===true) { dot.className='sync-dot'; label.textContent='已同步'; }
  else if (success===false) { dot.className='sync-dot error'; label.textContent='同步失败'; }
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowMin() { const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function dayOfWeek() { return new Date().getDay(); } // 0=Sun

// ── TIME WINDOWS ──
const TIME_WINDOWS = {
  breakfast: [0, 660],
  lunch: [660, 1020],
  dinner: [1020, 1440],
  'morning-sc': [660, 1290],
  'night-sc': [1290, 1440],
};
const LOCK_AFTER = { breakfast: 660, lunch: 1020, dinner: 1440 };

function getStatus(type) {
  const now = nowMin();
  const [start, end] = TIME_WINDOWS[type] || [0,1440];
  const lock = LOCK_AFTER[type] || end;
  if (now >= start && now <= end) return 'now';
  if (now > lock) return 'locked';
  if (now < start) return 'future';
  return 'past';
}

function renderBadge(elId, type) {
  const el = document.getElementById(elId); if(!el) return;
  const s = getStatus(type);
  const w = TIME_WINDOWS[type];
  let text, cls;
  if (s==='now') { text='现在'; cls='time-now'; }
  else if (s==='locked') { text='已过期'; cls='time-locked'; }
  else if (s==='future') { const h=Math.floor(w[0]/60),m=w[0]%60; text=`${h}:${String(m).padStart(2,'0')}`; cls='time-future'; }
  else { text='补打卡'; cls='time-past'; }
  el.textContent=text; el.className='task-time '+cls;
}

// ── MEAL HANDLING ──
function handleMeal(type) {
  if (state.meals[type]) return;
  const s = getStatus(type);
  if (s==='locked') return;
  if (s==='future') return;
  if (s==='now') { recordMeal(type, false, {}); return; }
  showLate(type);
}

async function recordMeal(type, late, extras) {
  const today = todayStr();
  const row = { date: today, meal_type: type, done: true, late, created_at: new Date().toISOString(), ...extras };
  // upsert via delete+insert approach: check existing
  const existing = await supa('GET', 'meal_logs', null, `?date=eq.${today}&meal_type=eq.${type}&select=id`);
  if (existing && existing.length > 0) {
    await supa('PATCH', 'meal_logs', row, `?date=eq.${today}&meal_type=eq.${type}`);
  } else {
    await supa('POST', 'meal_logs', row);
  }
  state.meals[type] = row;
  renderMeals();
  updateStats();
  showPraise(type);
}

function submitLate() {
  const type = pendingLateType;
  const cfg = LATE_CONFIGS[type];
  let valid = true; const vals = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById('lf-'+f.id);
    const err = document.getElementById('err-'+f.id);
    if (!el.value.trim() || el.value.trim().length < 2) {
      el.classList.add('error'); err.classList.add('show'); valid = false;
    } else {
      el.classList.remove('error'); err.classList.remove('show');
      vals[f.id] = el.value.trim();
    }
  });
  if (!valid) return;
  closeModal('modal-late');
  recordMeal(type, true, vals);
}

async function confirmPeriodAction() {
  closeModal('modal-period');
  const today = todayStr();
  if (periodAction==='start') {
    const row = { start_date: today, created_at: new Date().toISOString() };
    const res = await supa('POST','period_logs',row);

    state.period = { ...state.period, end_date: today };

function renderPeriod() {
  const el = document.getElementById('period-card');
  const today = new Date();
  let html = '';

  if (state.period) {
    const start = new Date(state.period.start_date);
    const daysSince = Math.floor((today - start) / 86400000);
    const hasEnded = !!state.period.end_date;

    if (!hasEnded && daysSince <= 10) {
      // Currently in period
      html = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span class="period-pill active">经期中</span>
          <span style="font-size:12px;color:var(--text-muted);">第 ${daysSince+1} 天</span>
        </div>
        <div style="font-size:13px;margin-bottom:4px;">开始于 ${state.period.start_date}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">预计还有约 ${Math.max(0,7-daysSince)} 天结束</div>
        <div class="period-btns">
          <button class="period-btn primary" onclick="showPeriodModal('end')">记录结束</button>
        </div>`;
    } else {
      // Predict next
      const endDate = hasEnded ? new Date(state.period.end_date) : new Date(start.getTime() + 7*86400000);
      const nextStart = new Date(start.getTime() + 30*86400000);
      const daysToNext = Math.ceil((nextStart - today) / 86400000);
      const soon = daysToNext <= 5 && daysToNext >= 0;
      const pillClass = soon ? 'soon' : 'normal';
      const pillText = soon ? '即将来临' : '安全期';
      html = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span class="period-pill ${pillClass}">${pillText}</span>
          <span style="font-size:12px;color:var(--text-muted);">上次：${state.period.start_date}</span>
        </div>
        <div style="font-size:13px;margin-bottom:4px;">${daysToNext>0?`距下次约 ${daysToNext} 天`:'预计今天或已到'}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">预计下次：${nextStart.getMonth()+1}月${nextStart.getDate()}日</div>
        <div class="period-btns">
          <button class="period-btn primary" onclick="showPeriodModal('start')">来了！记录开始</button>
        </div>`;
    }
  } else {
    html = `
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">还没有记录，点下面开始追踪</div>
      <div class="period-btns">
        <button class="period-btn primary" onclick="showPeriodModal('start')">来了！记录开始</button>
      </div>`;
  }
  el.innerHTML = html;
}

function renderBadges() {
  renderBadge('badge-breakfast','breakfast');
  renderBadge('badge-lunch','lunch');
  renderBadge('badge-dinner','dinner');
  renderBadge('badge-morning-sc','morning-sc');
  renderBadge('badge-night-sc','night-sc');
}

async function updateStats() {
  // Fetch last 30 days
  const d30 = new Date(); d30.setDate(d30.getDate()-30);
  const d30str = d30.toISOString().split('T')[0];
  const meals = await supa('GET','meal_logs',null,`?date=gte.${d30str}&select=date,meal_type`);
  const sc = await supa('GET','skincare_logs',null,`?date=gte.${d30str}&select=date,session,done`);
  if (!meals || !sc) return;

  // Build per-day map
  const dayMap = {};
  meals.forEach(m => { if(!dayMap[m.date]) dayMap[m.date]={}; dayMap[m.date][m.meal_type]=true; });
  sc.forEach(s => { if(!dayMap[s.date]) dayMap[s.date]={}; if(s.done) dayMap[s.date]['sc_'+s.session]=true; });

  const days = Object.keys(dayMap).sort();
  const total = days.length;

  // Streak
  let streak = 0;
  const today = todayStr();
  for (let i=days.length-1; i>=0; i--) {
    const d = days[i];
    const hasAny = Object.keys(dayMap[d]).length > 0;
    if (hasAny) streak++; else break;
  }

  // This week rate
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate()-6);
  const weekDays = days.filter(d => d >= weekStart.toISOString().split('T')[0]);
  let done=0, possible=weekDays.length*5;
  weekDays.forEach(d => { done += Object.keys(dayMap[d]).length; });
  const rate = possible>0 ? Math.round(done/possible*100) : 0;

  document.getElementById('streak-days').textContent = streak;
  document.getElementById('total-days').textContent = total;
  document.getElementById('complete-rate').textContent = rate+'%';

  // Streak milestones
  if (streak===3) showPraise('streak3');
  else if (streak===7) showPraise('streak7');
  else if (streak===14) showPraise('streak14');
}

async function renderHistory() {
  const d14 = new Date(); d14.setDate(d14.getDate()-14);
  const d14str = d14.toISOString().split('T')[0];
  const [meals, sc, water] = await Promise.all([
    supa('GET','meal_logs',null,`?date=gte.${d14str}&select=date,meal_type,late&order=date.desc`),
    supa('GET','skincare_logs',null,`?date=gte.${d14str}&select=date,session,done,skipped&order=date.desc`),
    supa('GET','water_logs',null,`?date=gte.${d14str}&select=date,cups&order=date.desc`),
  ]);
  const dayMap = {};
  const addDay = d => { if(!dayMap[d]) dayMap[d]={meals:[],sc:[],water:0}; };
  (meals||[]).forEach(m => { addDay(m.date); dayMap[m.date].meals.push(m); });
  (sc||[]).forEach(s => { addDay(s.date); dayMap[s.date].sc.push(s); });
  (water||[]).forEach(w => { addDay(w.date); dayMap[w.date].water=w.cups; });

  const el = document.getElementById('history-items');
  const days = Object.keys(dayMap).sort().reverse();
  if (!days.length) { el.innerHTML='<div style="padding:1.5rem;text-align:center;font-size:13px;color:var(--text-muted);">还没有记录</div>'; return; }

  el.innerHTML = days.map(d => {
    const data = dayMap[d];
    const tags = [];
    data.meals.forEach(m => {
      const names = {breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
      tags.push(`<span class="history-tag h-done">${names[m.meal_type]||m.meal_type}${m.late?'(补)':''}</span>`);
    });
    data.sc.forEach(s => {
      const names = {morning:'早间护肤',night:'晚间护肤'};
      if(s.done) tags.push(`<span class="history-tag h-done">${names[s.session]}</span>`);
      else if(s.skipped) tags.push(`<span class="history-tag h-skip">跳过${s.session==='morning'?'早间':'晚间'}</span>`);
    });
    if(data.water>0) tags.push(`<span class="history-tag h-note">喝水${data.water}杯</span>`);
    if(!tags.length) return '';
    return `<div class="history-item"><div class="history-date">${d}</div><div class="history-tags">${tags.join('')}</div></div>`;
  }).filter(Boolean).join('') || '<div style="padding:1.5rem;text-align:center;font-size:13px;color:var(--text-muted);">还没有记录</div>';
}

// ── MODAL HELPERS ──
function showModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function toggleSection(id) {
  const el = document.getElementById(id);
  const icon = document.getElementById('icon-'+id);
  const open = el.classList.toggle('open');
  if(icon) icon.style.transform = open?'rotate(180deg)':'';
  if (id==='history-list' && open) renderHistory();
}

// Close modals on overlay click
['modal-confirm','modal-late','modal-period'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)closeModal(id);});
});

// ── LOAD TODAY DATA ──
async function loadToday() {
  const today = todayStr();
  const [meals, sc, water, period] = await Promise.all([
    supa('GET','meal_logs',null,`?date=eq.${today}&select=*`),
    supa('GET','skincare_logs',null,`?date=eq.${today}&select=*`),
    supa('GET','water_logs',null,`?date=eq.${today}&select=*`),
    supa('GET','period_logs',null,`?order=created_at.desc&limit=1&select=*`),
  ]);
  (meals||[]).forEach(m => state.meals[m.meal_type]=m);
  (sc||[]).forEach(s => state.skincare[s.session]=s);
  state.water = (water&&water[0]) ? water[0].cups : 0;
  state.period = (period&&period[0]) ? period[0] : null;
}

// ── INIT ──
async function init() {
  const d=new Date(),days=['日','一','二','三','四','五','六'];
  document.getElementById('today-date').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${days[d.getDay()]}`;
  renderSkincareSteps();
  renderBadges();
  renderWater();
  await loadToday();
  renderMeals();
  renderSkincare();
  renderWater();
  renderPeriod();
  updateStats();
  setInterval(()=>{ renderBadges(); renderMeals(); }, 60000);
}

init();
</script>
